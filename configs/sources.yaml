  # Smaller Devanagari pool. One cap per path (per language). Names are the
  # FineWeb-2 language-distribution names for the matching *_Deva config.
  # und_Deva is included because it is a real *_Deva config; the card calls it
  # undetermined language, published without dedup or filtering.
  # Languages of Nepal are nepal_pool, not in this list.
  - id: deva_pool_fw2
    bucket: Smaller Devanagari
    role: train
    repo: HuggingFaceFW/fineweb-2
    repo_type: dataset
    config: "*_Deva except npi, hin, mar, san and the nepal_pool hold"
    split: train
    per_path_cap: 300000000
    paths:
      - data/anp_Deva/train
      - data/awa_Deva/train
      - data/bho_Deva/train
      - data/brx_Deva/train
      - data/doi_Deva/train
      - data/dty_Deva/train
      - data/fmu_Deva/train
      - data/gom_Deva/train
      - data/hne_Deva/train
      - data/kas_Deva/train
      - data/kru_Deva/train
      - data/mag_Deva/train
      - data/mai_Deva/train
      - data/mup_Deva/train
      - data/sck_Deva/train
      - data/snd_Deva/train
      - data/und_Deva/train
    text_column: text
    card_license: odc-by

  - id: deva_pool_sangraha
    bucket: Smaller Devanagari
    role: train
    repo: ai4bharat/sangraha
    repo_type: dataset
    config: verified
    split: "brx, doi, gom, mai, kas, snd"
    per_path_cap: 300000000
    paths:
      - verified/brx
      - verified/doi
      - verified/gom
      - verified/mai
      - verified/kas
      - verified/snd
    text_column: text
    card_license: cc-by-4.0
    note: >
      Sangraha verified splits have no script tag. These six match a FineWeb-2
      *_Deva config for the same ISO code. mni and sat are omitted: IndicCorp v2
      labels them mni_Mtei and santhali, and FineWeb-2 has no mni_Deva or sat_Deva
      folder. asm, ben, guj, kan, mal, ori, pan, tam, tel, urd, eng are not
      Devanagari. No bho, awa, mag, dty, hne or anp split exists under verified.

  - id: deva_pool_hplt
    bucket: Smaller Devanagari
    role: train
    repo: HPLT/HPLT2.0_cleaned
    repo_type: dataset
    config: "awa_Deva, bho_Deva, hne_Deva, kas_Deva, mag_Deva, mai_Deva"
    split: train
    per_path_cap: 300000000
    paths:
      - awa_Deva
      - bho_Deva
      - hne_Deva
      - kas_Deva
      - mag_Deva
      - mai_Deva
    text_column: text
    card_license: cc0-1.0
    note: >
      HPLT v2 cleaned Devanagari folders found by list_repo_tree: awa, bho, hin,
      hne, kas, mag, mai, mar, npi, san. hin, mar, san and npi are not pool
      members (npi is hplt_npi; hin, mar and san are not in the HPLT rows of the
      data-plan table). No anp, brx, doi, dty or gom folder exists in this repo.

  - id: owm
    bucket: Math
    role: train
    repo: open-web-math/open-web-math
    repo_type: dataset
    config: default
    split: train
    paths: [data]
    amount: 1000000000
    text_column: text
    card_license: "README: ODC-By 1.0. Hub YAML license tag is absent."

  - id: code
    bucket: Code
    role: train
    repo: codeparrot/github-code-clean
    repo_type: dataset
    config: direct parquet (loader is a script)
    split: train
    paths: [data]
    amount: 1000000000
    text_column: code
    card_license: apache-2.0
    # Shard data/train-00000-of-00880.parquet (355122552 bytes, 126925 rows):
    # kept UTF-8 of mit/apache-2.0/bsd-2-clause/bsd-3-clause rows = 550829383.
    # Columns present: code, repo_name, path, language, license, size.
    keep_ratio: 1.551095178
    note: >
      Read data/*.parquet directly. One shard was opened. Columns are code,
      repo_name, path, language, license, size. Keep license values mit,
      apache-2.0, bsd-2-clause and bsd-3-clause. keep_ratio is kept UTF-8
      bytes divided by that shard's file size (550829383 / 355122552).

