# data-plan source inventory. Paths and dataset IDs were read from the Hub API and
# dataset cards on 4 Nov 2026. Byte budgets use 1 GB = 10^9 bytes, as written
# in docs/SPEC.md. `amount: all` downloads every file under `paths`. A number is a
# UTF-8 text cap. `download: false` rows are listed for the human and are not
# part of the disk total.
#
# Wikipedia is not a training source (docs/SPEC.md 3.8). It is absent here on purpose.

gb_bytes: 1000000000
free_floor_bytes: 50000000000
# 3.8: under 32 GB RAM the snapshot is 5 GB, not 10 GB.
snapshot_bytes: 5000000000
# data-plan step 1 says "the 3 snapshots". cleaning writes four (45%, 50%, 60%, 50% no joiner).
snapshot_count_data_plan_wording: 3
snapshot_count_cleaning: 4
# Count tables, tokenizers and eval artifacts. Not an API measurement.
counts_allowance_bytes: 10000000000

sources:
