    amount: all
    fixed_bytes: 572208
    card_license: "Code MIT. Affix inventory CC BY 4.0 (data/LICENSE), not MIT."
    revision: b3498528daa3435f091792e0b44bb222a2f8cb68
    note: >
      Commit b3498528daa3435f091792e0b44bb222a2f8cb68. Files
      data/affix_inventory.tsv (81127 bytes) and data/affix_inventory.json
      (491081 bytes), plus data/LICENSE. Root LICENSE is MIT for code only;
      data/LICENSE puts the affix inventory under CC BY 4.0. Evaluation only.
