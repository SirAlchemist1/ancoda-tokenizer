# Training mix (PLAN.md 3.8). Shares are by UTF-8 bytes. Seed is fixed.
# Under 32 GB RAM the snapshot is 5 GB (sources.yaml snapshot_bytes).

seed: 20261104
temperature: 0.3
# Joiner copy is 1% of the snapshot, taken out of Nepali (49% natural + 1% synthetic).
joiner_share: 0.01

buckets:
  Nepali:
    share: 0.50
    sources: [fw2_npi, iriis, sangraha_nep, indiccorp_npi, hplt_npi]
    keep_labels: [npi_Deva]
    expected_scripts: [Devanagari]
  English:
    share: 0.20
    sources: [fwedu_en]
    keep_labels: [eng_Latn]
    expected_scripts: [Latin]
  Hindi:
    share: 0.10
    sources: [fw2_hin, sangraha_hin]
    keep_labels: [hin_Deva]
    expected_scripts: [Devanagari]
  Marathi:
    share: 0.03
    sources: [fw2_mar, sangraha_mar]
    keep_labels: [mar_Deva]
    expected_scripts: [Devanagari]
  Sanskrit:
    share: 0.03
    sources: [fw2_san, sangraha_san]
    keep_labels: [san_Deva]
    expected_scripts: [Devanagari]
  Smaller Devanagari:
    share: 0.04
    sources: [deva_pool_fw2, deva_pool_sangraha, deva_pool_hplt]
    keep_labels:
      - anp_Deva
      - awa_Deva
      - bho_Deva
      - brx_Deva
      - doi_Deva
      - dty_Deva
      - fmu_Deva
      - gom_Deva
      - hne_Deva
      - kas_Deva
      - kru_Deva
      - mag_Deva
      - mai_Deva
      - mup_Deva
      - sck_Deva
      - snd_Deva
      - und_Deva
    expected_scripts: [Devanagari]
  Languages of Nepal:
    share: 0.02
    sources: [nepal_pool]
    keep_labels:
      - new_Deva
      - thl_Deva
      - taj_Deva
      - lif_Deva
      - rav_Deva
      - suz_Deva
      - xsr_Deva
      - rjs_Deva
      - kle_Deva
      - nwx_Deva
    expected_scripts: [Devanagari]
  Code:
    share: 0.05
    sources: [code]
    # GlotLID has no code label; UTF-8 only, no LID drop.
    keep_labels: []
    skip_lid: true
    expected_scripts: []
  Math:
    share: 0.03
    sources: [owm]
    keep_labels: []
    skip_lid: true
    expected_scripts: []

# Nepali source preference for MinHash cluster keepers (first wins).
nepali_dedup_preference:
  - sangraha_nep
  - iriis
  - indiccorp_npi
  - fw2_npi
  - hplt_npi

# Sweep Nepali shares for M7; others scale pro rata. Flagship is 0.50.
nepali_sweep: [0.45, 0.50, 0.60]

minhash:
  n_grams: 5
  num_buckets: 14
  hashes_per_bucket: 8
  language: npi_Deva

legacy_font:
  enabled: false
  detector: dictionary
  line_flag_threshold: 0.20
  min_lexicon_hits: 3
  min_hit_fraction: 0.50
  lexicon_top_n: 50000
  converter: globalpolicy/UnicodeToPreeti
  converter_commit: c1d6e3080976d7113c24ab5b59d06f937a20949d
  converter_license: MIT

script_outside_stop: 0.20
