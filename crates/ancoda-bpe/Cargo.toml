[package]
name = "ancoda-bpe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Trainer CLI: Blocks 0/1/2, bans, canonical encoder"

[[bin]]
name = "ancoda-bpe"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
ahash = "0.8"
